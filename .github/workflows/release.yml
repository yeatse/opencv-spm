name: Build and release a new version

on:
  push:
    branches: [ "main" ]
    paths: [ ".version", ".opencv-ref" ]

  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version
        id: get_version
        run: |
          VERSION=$(cat .version)
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            PATCH=$(git rev-list --count "refs/tags/${VERSION}..HEAD")
            VERSION="${VERSION}+${PATCH}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Update Package.swift
        run: |
          checksum() { shasum -a 256 "artifacts/opencv2-$1.xcframework.zip" | cut -d ' ' -f 1; }
          sed -i "s/let version = \".*\"/let version = \"${{ steps.get_version.outputs.VERSION }}\"/" Package.swift
          sed -i "s/let coreChecksum = \".*\"/let coreChecksum = \"$(checksum core)\"/" Package.swift
          sed -i "s/let nodnnChecksum = \".*\"/let nodnnChecksum = \"$(checksum nodnn)\"/" Package.swift
          sed -i "s/let fullChecksum = \".*\"/let fullChecksum = \"$(checksum full)\"/" Package.swift

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add Package.swift
          git commit -m "Update Package.swift"
          git push

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/opencv2-core.xcframework.zip
            artifacts/opencv2-nodnn.xcframework.zip
            artifacts/opencv2-full.xcframework.zip
          tag_name: ${{ steps.get_version.outputs.VERSION }}
