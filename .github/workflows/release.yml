name: Build and release a new version

on:
  push:
    tags:
      - "*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package and release"
        required: true
        type: string

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      checkout_ref: ${{ github.event.inputs.tag || github.ref }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: release_tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Update Package.swift for validation
        run: |
          set -euo pipefail
          version="${{ steps.release_tag.outputs.tag }}"
          sed -i "s/let version = \".*\"/let version = \"${version}\"/" Package.swift

          for tier in core nodnn full; do
            artifact="artifacts/opencv2-${tier}.xcframework.zip"
            checksum=$(shasum -a 256 "$artifact" | cut -d ' ' -f 1)
            constant="${tier}Checksum"
            sed -i "s/let ${constant} = \".*\"/let ${constant} = \"${checksum}\"/" Package.swift
          done

      - name: Validate Package.swift has release URLs and checksums
        run: swift package dump-package >/dev/null

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*.xcframework.zip
          tag_name: ${{ steps.release_tag.outputs.tag }}
