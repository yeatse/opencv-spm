name: Build OpenCV xcframework

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "opencv-spm ref to check out"
        required: false
        type: string
  workflow_call:
    inputs:
      checkout_ref:
        required: false
        type: string

jobs:
  build:
    runs-on: macos-14

    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimal: core image handling only (core, imgproc, imgcodecs,
          # geometry + its flann dependency).
          - tier: core
            without: >-
              --without dnn --without calib --without objdetect
              --without features --without stereo --without video
              --without photo --without videoio --without stitching
              --without highgui --without ptcloud
          # Everything except the deep-learning module, which dominates the
          # binary size. dnn has no mandatory dependents, so dropping it is clean.
          - tier: nodnn
            without: "--without dnn"
          # Full build: every module, including ptcloud.
          - tier: full
            without: ""

    steps:
      - name: Prepare Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: actions-setup-cmake
        uses: jwlawson/actions-setup-cmake@v1.13.1
        with:
          cmake-version: 3.28

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: opencv-spm
          ref: ${{ inputs.checkout_ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Get OpenCV ref
        id: get_ref
        working-directory: opencv-spm
        run: echo "REF=$(cat .opencv-ref)" >> $GITHUB_OUTPUT

      - name: Checkout OpenCV
        uses: actions/checkout@v4
        with:
          repository: opencv/opencv
          # Pinned to a commit on the 5.x branch (see opencv-spm/.opencv-ref).
          # The required ptcloud and KleidiCV C++17 fixes landed after the
          # 5.0.0 tag, so we build from a pinned 5.x commit rather than a tag.
          ref: ${{ steps.get_ref.outputs.REF }}
          path: 'opencv'

      - name: Build and zip xcframework
        working-directory: opencv
        env:
          IPHONEOS_DEPLOYMENT_TARGET: 12.0
          MACOSX_DEPLOYMENT_TARGET: 10.13
        run: |
          # Module set per tier is selected via --without (a blacklist; anything
          # not excluded is built, and excluding a module auto-disables its
          # dependents). See the matrix above.
          "$GITHUB_WORKSPACE"/opencv-spm/scripts/build-opencv-xcframework.sh \
            "${{ matrix.tier }}" \
            ${{ matrix.without }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencv2-${{ matrix.tier }}
          path: opencv/opencv2-${{ matrix.tier }}.xcframework.zip
          if-no-files-found: error
