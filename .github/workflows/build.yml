name: Build OpenCV xcframework

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-14

    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimal: core image handling only (core, imgproc, imgcodecs,
          # geometry + its flann dependency).
          - tier: core
            without: >-
              --without dnn --without calib --without objdetect
              --without features --without stereo --without video
              --without photo --without videoio --without stitching
              --without highgui --without ptcloud
          # Everything except the deep-learning module, which dominates the
          # binary size. dnn has no mandatory dependents, so dropping it is clean.
          - tier: nodnn
            without: "--without dnn"
          # Full build: every module, including ptcloud.
          - tier: full
            without: ""

    steps:
      - name: Prepare Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: actions-setup-cmake
        uses: jwlawson/actions-setup-cmake@v1.13.1
        with:
          cmake-version: 3.28

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: opencv-spm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Get OpenCV ref
        id: get_ref
        working-directory: opencv-spm
        run: echo "REF=$(cat .opencv-ref)" >> $GITHUB_OUTPUT

      - name: Checkout OpenCV
        uses: actions/checkout@v4
        with:
          repository: opencv/opencv
          # Pinned to a commit on the 5.x branch (see opencv-spm/.opencv-ref).
          # The required ptcloud and KleidiCV C++17 fixes landed after the
          # 5.0.0 tag, so we build from a pinned 5.x commit rather than a tag.
          ref: ${{ steps.get_ref.outputs.REF }}
          path: 'opencv'

      - name: Build xcframework
        working-directory: opencv
        env:
          IPHONEOS_DEPLOYMENT_TARGET: 12.0
          MACOSX_DEPLOYMENT_TARGET: 10.13
        run: |
          shopt -s nullglob
          patches=("$GITHUB_WORKSPACE"/opencv-spm/patches/*.patch)
          if [ ${#patches[@]} -gt 0 ]; then
            git apply "${patches[@]}"
          fi
          # OpenCV 5.x's build scripts call `git branch --show-current` and abort
          # if it returns empty, which happens on the detached HEAD left by a
          # commit checkout. Put HEAD on a named branch so the build can proceed.
          git checkout -b release
          # Pre-seed OpenCV's download cache with KleidiCV. Its source is
          # otherwise fetched from gitlab.arm.com at configure time, which
          # intermittently fails on CI with an SSL connect error and disables
          # the KleidiCV HAL acceleration (arm64 only). The vendored tarball is
          # placed at the exact cache path ocv_download() checks, so no network
          # access is needed and KleidiCV is reliably included.
          mkdir -p .cache/kleidicv
          cp "$GITHUB_WORKSPACE"/opencv-spm/vendor/kleidicv/b85a745bfe0e87e67e30be9533eb6b24-kleidicv-26.03.tar.gz .cache/kleidicv/
          pip3 install pathlib
          # Module set per tier is selected via --without (a blacklist; anything
          # not excluded is built, and excluding a module auto-disables its
          # dependents). See the matrix above.
          python3 platforms/apple/build_xcframework.py \
              --iphoneos_archs=arm64 \
              --visionos_archs=arm64 \
              --visionsimulator_archs=arm64 \
              ${{ matrix.without }} \
              -o build

      - name: Zip artifact
        working-directory: opencv
        run: zip -ry opencv2-${{ matrix.tier }}.xcframework.zip build/opencv2.xcframework

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencv2-${{ matrix.tier }}
          path: opencv/opencv2-${{ matrix.tier }}.xcframework.zip
          if-no-files-found: error
